# RSS endpoints almost never send Access-Control-Allow-Origin, so the page
# cannot read them from the browser. The feeds are fetched here and the result
# committed. tools/fetch_news.py has the feed list and the reasoning.
#
# The result lands on the orphan `data` branch, beside the outage archive, and
# the page reads it from raw.githubusercontent — which sends
# access-control-allow-origin:*, verified. It used to go to main, and in one
# day that put 136 bot commits into a 207-commit history: two thirds of the
# repository was this job, and `git log` stopped being readable. Same reason
# the outage capture was never allowed near main.
name: Refresh Austin headlines

on:
  schedule:
    # Backup only. Measured on this account: a plain */15 schedule fired zero
    # times in 97 minutes, and in news-wordcloud only 2 of 12 recent runs came
    # from schedule: at all. The self-dispatch chain below is what keeps this
    # alive. Offset off the quarter-hour, and staggered from the other two
    # chains here (outages 4,19,34,49 — news-wordcloud 7,22,37,52).
    - cron: "11,41 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write          # the self-dispatch needs this

concurrency:
  group: refresh-news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    # Two fetches twenty minutes apart, then a third wait before handing off,
    # so the whole job is 40 minutes of sleep plus overhead.
    timeout-minutes: 55
    steps:
      - name: Arm the next run
        # First, so the chain survives even if everything below fails.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run "Refresh Austin headlines" \
            --repo "${{ github.repository }}" --ref main \
            || echo "Self-dispatch failed — the cron backup will have to catch it."

      - uses: actions/checkout@v4

      - name: Stash the fetcher and the gazetteer before leaving main
        run: |
          cp tools/fetch_news.py "$RUNNER_TEMP/fetch_news.py"
          cp atx/data/gazetteer.json "$RUNNER_TEMP/gazetteer.json"

      - name: Switch to the archive branch, creating it the first time
        run: |
          set -euo pipefail
          git config user.name  "news-ticker[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data:refs/remotes/origin/data
            git checkout -B data refs/remotes/origin/data
          else
            git checkout --orphan data
            git rm -rfq . || true
          fi

      - name: Fetch, twice, twenty minutes apart
        run: |
          set -uo pipefail
          mkdir -p news
          for i in 1 2; do
            for attempt in 1 2 3; do
              # news.json is regenerated whole every run, so there is nothing in
              # it worth merging — take the remote tip and rewrite on top rather
              # than trying to rebase two independently generated files.
              git fetch --depth=1 --quiet origin data:refs/remotes/origin/data || true
              git reset --hard --quiet refs/remotes/origin/data || true
              mkdir -p news
              python3 "$RUNNER_TEMP/fetch_news.py" \
                --gazetteer "$RUNNER_TEMP/gazetteer.json" \
                --out news/news.json || break
              git add news/news.json
              if git diff --cached --quiet; then
                echo "no new headlines"
                break
              fi
              N=$(python3 -c 'import json; print(len(json.load(open("news/news.json"))["items"]))')
              git commit -q -m "Headlines: $N at $(date -u +%Y-%m-%dT%H:%MZ)"
              if git push --quiet origin data; then
                break
              fi
              echo "push lost a race (attempt $attempt/3), resyncing"
            done
            # Sleep after EVERY fetch, the last one included. The successor is
            # already sitting in the concurrency queue and starts the instant
            # this job ends, so a run that finishes right after its own last
            # fetch hands over to a run that fetches immediately — two commits
            # fifteen seconds apart, once per handoff. This trailing sleep is
            # what makes the gap across a handoff the same as the gap within a
            # run. It costs an idle runner; the interval is the point.
            sleep 1200
          done
