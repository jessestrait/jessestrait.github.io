# Three witnesses to Austin's streets, written down as they happen.
#
# TomTom and HERE each see congestion, from different fleets, and APD/ATD
# sees the reported cause; none of it is archived anywhere, so the question
# "how long does a wreck take to become a jam, and how long does the jam
# outlive it" has no source today. This builds one.
# tools/capture_traffic.py has the matcher and the reasoning.
#
# The archive lives on the orphan `data` branch, beside the outages, so it
# never rebuilds the Pages site.
#
# KEYS.
#
# TOMTOM_ARCHIVE_KEY (required) must NOT be the key in the page. That one is
# domain-restricted to jessestrait.com — verified: a request without a
# referrer comes back 403 InvalidReferer — and Actions sends no referrer, so
# the page key cannot work here by construction. Two keys, two jobs.
#
# HERE_ARCHIVE_KEY (optional) is the third witness. Without it the job runs
# on two exactly as it did before and says so in the log; it is not allowed
# to take the chain down, because a missing third source is a smaller
# problem than a stopped archive. Create one at platform.here.com under a
# freemium project and add it with:
#
#     gh secret set HERE_ARCHIVE_KEY --repo jessestrait/jessestrait.github.io
#
# RETENTION. HERE caps caching of their data at thirty days. The collector
# prunes vendor-bearing daily files after --retain-days, which is two, and
# refuses any value above thirty outright — so the cap is enforced by the
# code rather than by remembering.
name: Capture traffic corroboration

on:
  schedule:
    # Backup only; the self-dispatch chain below is what actually keeps this
    # alive. Offset from the other two chains in this repo (outages 4,19,34,49
    # — news 11,41) so three jobs never queue against each other.
    #
    # This used to fire four times an hour against a chain that cycles every
    # 42 minutes, and every one of those firings *added a run* — the backup
    # was racing the thing it was backing up. Measured over 40 runs: 1.9
    # starts an hour where the chain alone gives 1.4, seven of them from
    # `schedule`, shortest gap 10.9 minutes. That surplus is what put the
    # archive six times over TomTom's 2,500/month Incident Details
    # allowance, at about 531 polls a day against the ~274 intended.
    #
    # Twice an hour now, and — the part that actually fixes it — a
    # scheduled run checks whether the chain is alive before doing
    # anything. See "Stand down".
    - cron: "24,54 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write          # the self-dispatch needs this

concurrency:
  group: capture-traffic
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    # Eight polls five minutes apart, plus a trailing wait before handing
    # off, so the whole job is 45 minutes of sleep plus overhead.
    timeout-minutes: 70
    steps:
      # Every poll rewrites open.json with a new fetched_at, so the data
      # branch gets a commit roughly every five minutes while the chain is
      # healthy. That makes "when was data last committed" a reliable
      # liveness check, and a cheap one — one API call, no checkout.
      #
      # A scheduled run that finds the chain alive stops here, and
      # critically does *not* arm a successor: a backup that dispatches
      # while the primary is running is not a backup, it is a second
      # primary. That was half the surplus.
      - name: Stand down if the chain is already alive
        id: check
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          LAST=$(gh api "repos/${{ github.repository }}/commits/data" \
                   --jq '.commit.committer.date' 2>/dev/null || echo "")
          if [ -z "$LAST" ]; then
            echo "No data branch yet — the backup should run."
            echo "alive=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          AGE=$(( $(date -u +%s) - $(date -u -d "$LAST" +%s 2>/dev/null \
                 || python3 -c "import datetime,sys;print(int(datetime.datetime.fromisoformat(sys.argv[1].replace('Z','+00:00')).timestamp()))" "$LAST") ))
          echo "Last data commit was ${AGE}s ago."
          # 25 minutes: comfortably more than the 5-minute poll gap, and
          # comfortably less than the 42-minute chain cycle, so this says
          # "a job is running" and not "a job ran recently".
          if [ "$AGE" -lt 1500 ]; then
            echo "Chain is alive. Standing down rather than racing it."
            echo "alive=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No data commit for ${AGE}s — the chain looks dead, taking over."
            echo "alive=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Arm the next run
        # First, so the chain survives even if everything below fails.
        if: steps.check.outputs.alive != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run "Capture traffic corroboration" \
            --repo "${{ github.repository }}" --ref main \
            || echo "Self-dispatch failed — the cron backup will have to catch it."

      - uses: actions/checkout@v4
        if: steps.check.outputs.alive != 'true'

      - name: Stash the collector before leaving main
        if: steps.check.outputs.alive != 'true'
        run: cp tools/capture_traffic.py "$RUNNER_TEMP/capture_traffic.py"

      - name: Switch to the archive branch, creating it the first time
        if: steps.check.outputs.alive != 'true'
        run: |
          set -euo pipefail
          git config user.name  "traffic-archive[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data:refs/remotes/origin/data
            git checkout -B data refs/remotes/origin/data
          else
            git checkout --orphan data
            git rm -rfq . || true
          fi

      - name: Poll eight times, five minutes apart
        if: steps.check.outputs.alive != 'true'
        env:
          TOMTOM_ARCHIVE_KEY: ${{ secrets.TOMTOM_ARCHIVE_KEY }}
          HERE_ARCHIVE_KEY: ${{ secrets.HERE_ARCHIVE_KEY }}
        run: |
          set -uo pipefail
          if [ -z "${TOMTOM_ARCHIVE_KEY:-}" ]; then
            echo "::error::TOMTOM_ARCHIVE_KEY is not set. Create a second TomTom key"
            echo "::error::with no domain restriction and add it as a repository secret."
            exit 1
          fi
          for i in 1 2 3 4 5 6 7 8; do
            for attempt in 1 2 3; do
              # open.json carries the state that decides whether an incident is
              # new or continuing, so it has to be the newest one — starting
              # from a stale copy would reopen episodes already closed.
              git fetch --depth=1 --quiet origin data:refs/remotes/origin/data || true
              git reset --hard --quiet refs/remotes/origin/data || true
              mkdir -p traffic
              python3 "$RUNNER_TEMP/capture_traffic.py" --out traffic --interval 5 || break
              git add traffic
              if git diff --cached --quiet; then
                echo "nothing changed"
                break
              fi
              SUMMARY=$(python3 -c 'import json,glob,os; f=sorted(glob.glob("traffic/summary/*.json"))[-1]; c=json.load(open(f))["counts"]; print("%d tomtom, %d here, %d dispatch, %d matched" % (c["tomtom"], c.get("here",0), c["dispatch"], c["matched"]))')
              git commit -q -m "Traffic: $SUMMARY at $(date -u +%Y-%m-%dT%H:%MZ)"
              if git push --quiet origin data; then
                break
              fi
              echo "push lost a race (attempt $attempt/3), resyncing"
            done
            # Sleep after EVERY poll, the last one included — see the same note
            # in refresh-news.yml. The successor is already queued behind this
            # job and starts the moment it ends, so without a trailing sleep
            # the handoff polls twice within seconds.
            sleep 300
          done
