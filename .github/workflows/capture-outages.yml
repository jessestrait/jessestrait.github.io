# Austin Energy publishes an outage map, not an outage archive. Nothing here can
# be backfilled: a poll we miss is history that will not exist. Endpoint
# discovery notes live in tools/capture_outages.py and NOTES.md.
name: Capture Austin Energy outages

on:
  schedule:
    # Backup only, and offset off the quarter-hour on purpose: GitHub's
    # scheduler is congested at :00/:15/:30/:45 where everyone's crons pile up.
    # Staggered from news-wordcloud's 7,22,37,52 so the two do not collide.
    #
    # This is a backup because on this account it has been measured: over the
    # first 97 minutes of a plain */15 schedule it fired zero times, and in
    # news-wordcloud only 2 of 12 recent runs came from schedule: at all. The
    # self-dispatch chain below is the mechanism that actually keeps this alive.
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write          # the self-dispatch needs this

concurrency:
  # Queue behind a running job rather than starting beside it — two jobs writing
  # the same day file would race. This is also what de-dupes the self-dispatch
  # against schedule:'s own firings.
  group: capture-outages
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    # Three polls fifteen minutes apart, then a fourth wait before handing off,
    # so the whole job is 45 minutes of sleep plus overhead.
    timeout-minutes: 65
    steps:
      - name: Arm the next run
        # First, so the chain survives even if everything below fails. Each run
        # dispatches its successor, which concurrency then holds until this job
        # ends — so the chain paces itself at roughly one job per 45 minutes and
        # depends on no external scheduler.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run "Capture Austin Energy outages" \
            --repo "${{ github.repository }}" --ref main \
            || echo "Self-dispatch failed — the cron backup will have to catch it."

      - uses: actions/checkout@v4

      - name: Stash the collector before leaving main
        run: cp tools/capture_outages.py "$RUNNER_TEMP/capture.py"

      - name: Switch to the archive branch, creating it the first time
        run: |
          set -euo pipefail
          git config user.name  "outage-archive[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data:refs/remotes/origin/data
            git checkout -B data refs/remotes/origin/data
          else
            git checkout --orphan data
            git rm -rfq . || true
          fi

      - name: Poll three times, fifteen minutes apart
        run: |
          set -uo pipefail
          for i in 1 2 3; do
            for attempt in 1 2 3; do
              # Reset to the remote tip first. open.json carries the state that
              # decides whether an outage is new or continuing, so it has to be
              # the newest one — starting from a stale copy would reopen
              # episodes another run already closed.
              git fetch --depth=1 --quiet origin data:refs/remotes/origin/data || true
              git reset --hard --quiet refs/remotes/origin/data || true
              python3 "$RUNNER_TEMP/capture.py" --out outages || break
              git add outages
              if git diff --cached --quiet; then
                echo "nothing changed"
                break
              fi
              SUMMARY=$(python3 -c 'import json; d = json.load(open("outages/open.json")); e = d["episodes"]; print("%d ZIP(s) out, %d customers" % (len(e), sum(x.get("peak_customers_affected") or 0 for x in e)) if e else "all clear")')
              git commit -q -m "Outages: $SUMMARY at $(date -u +%Y-%m-%dT%H:%MZ)"
              if git push --quiet origin data; then
                break
              fi
              echo "push lost a race (attempt $attempt/3), resyncing"
            done
            # Sleep after EVERY poll, the last one included — see the same
            # note in refresh-news.yml. Without it the queued successor starts
            # the moment this job ends and polls straight away, which is where
            # the paired commits every 45 minutes came from.
            sleep 900
          done
